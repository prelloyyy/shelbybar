kind = "web"
previewPath = "/"
title = "ШЕЛБИ — Караоке-бар"
description = "Адаптивный одностраничный сайт караоке-бара ШЕЛБИ в Липецке с атмосферой закрытого клуба, меню, галереей и бронированием столов."
version = "1.0.0"
id = "artifacts/shelby-karaoke-bar"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20669

[services.development]
run = "pnpm --filter @workspace/shelby-karaoke-bar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shelby-karaoke-bar", "run", "build" ]
serve = "static"
publicDir = "artifacts/shelby-karaoke-bar/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20669"
BASE_PATH = "/"
